name: cron-session-reminder

# 5分おきに本番（staging）の cron API を叩いて、
# 前日 8:30 JST 以降〜セッション開始前の 1on1 リマインドメールを送信する。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/session-reminder
        env:
          CRON_URL: https://companion-scheduling--motive-iji-cloud-1e300.asia-east1.hosted.app/api/cron/session-reminder
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in this repository."
            exit 1
          fi
          STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST "$CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 60)
          echo "HTTP $STATUS"
          cat response.txt || true
          if [ "$STATUS" != "200" ]; then
            echo "::error::cron call failed with HTTP $STATUS"
            exit 1
          fi
